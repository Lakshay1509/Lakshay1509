<svg viewBox="0 0 1000 110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status: shipping. New Delhi, India. neatmail.app">
  <style>
    .m { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #000000; }
    .draw { stroke: #000000; stroke-width: 1; stroke-dasharray: 1000; animation: d 1.6s cubic-bezier(.6,0,.2,1) backwards; }
    @keyframes d { from { stroke-dashoffset: 1000; } }
    .dot { animation: p 2.4s ease-in-out infinite; }
    .ring { animation: r 2.4s ease-out infinite; transform-origin: 60px 64px; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes r { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(2.6);opacity:0} }
    @media (prefers-reduced-motion: reduce) { .draw,.dot,.ring { animation: none; } .draw { stroke-dashoffset: 0; } .ring { opacity: 0; } }
  </style>
  <line class="draw" x1="48" y1="24" x2="952" y2="24"/>
  <circle class="ring" cx="60" cy="64" r="5" stroke="#000000" stroke-width="1" fill="none"/>
  <circle class="dot" cx="60" cy="64" r="4" fill="#000000"/>
  <text class="m" x="82" y="62" font-size="12" letter-spacing="3">STATUS · SHIPPING</text>
  <text class="m" fill-opacity=".6" x="82" y="82" font-size="11" letter-spacing="2">usually between a BullMQ worker and a Postgres migration</text>
  <text class="m" fill-opacity=".6" x="952" y="66" font-size="15" text-anchor="end">neatmail.app&#160;&#160;·&#160;&#160;New Delhi, IN&#160;&#160;·&#160;&#160;2026</text>
</svg>
