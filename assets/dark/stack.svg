<svg viewBox="0 0 1000 206" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack: languages, frontend, backend, data, AI, tooling">
  <style>
    .m { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #FFFFFF; }
    .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) backwards; }
    @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="138" y1="8" x2="138" y2="198" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1"/>

  <text class="m rise a1" fill-opacity=".6" x="48" y="32" font-size="12" letter-spacing="2">LANGUAGES</text>
  <text class="m rise a1" x="154" y="32" font-size="15">TypeScript · JavaScript · Python · C++ · C · SQL</text>

  <text class="m rise a2" fill-opacity=".6" x="48" y="64" font-size="12" letter-spacing="2">FRONTEND</text>
  <text class="m rise a2" x="154" y="64" font-size="15">React · Next.js · Tailwind CSS · TanStack Query · Streamlit</text>

  <text class="m rise a3" fill-opacity=".6" x="48" y="96" font-size="12" letter-spacing="2">BACKEND</text>
  <text class="m rise a3" x="154" y="96" font-size="15">Node.js · Express · Hono · tRPC · FastAPI · Flask</text>

  <text class="m rise a4" fill-opacity=".6" x="48" y="128" font-size="12" letter-spacing="2">DATA</text>
  <text class="m rise a4" x="154" y="128" font-size="15">PostgreSQL · MySQL · MongoDB · Redis · Prisma · Drizzle · BullMQ</text>

  <text class="m rise a5" fill-opacity=".6" x="48" y="160" font-size="12" letter-spacing="2">AI</text>
  <text class="m rise a5" x="154" y="160" font-size="15">LangChain · LangGraph · OpenAI · Groq · Pinecone · FAISS · TensorFlow</text>

  <text class="m rise a6" fill-opacity=".6" x="48" y="192" font-size="12" letter-spacing="2">TOOLING</text>
  <text class="m rise a6" x="154" y="192" font-size="15">Docker · Git · GitHub · Clerk · Electron</text>
</svg>
